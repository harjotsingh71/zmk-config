# ── Right Half — Peripheral Config ────────────────────────────────────────────
# Mirror of left — same settings, both halves are pure BLE peripherals.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
CONFIG_LED=n

# ── Power saving ──────────────────────────────────────────────────────────────
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── Display ───────────────────────────────────────────────────────────────────
# Same as left — uncomment once you have the nice!view wiring confirmed.
#
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_POINTING=y
