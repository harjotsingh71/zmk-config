# ── TEMPORARY DEBUG CONFIG ────────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ── Wake up the hardware for logging ──────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_SERIAL=y

# ── Pointing ──────────────────────────────────────────────────────────────────
CONFIG_ZMK_POINTING=y

# ── Debugging ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
