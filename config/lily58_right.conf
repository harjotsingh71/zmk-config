# ── TEMPORARY DEBUG CONFIG ────────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# ── Rebuild the USB Serial Stack ──────────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── Hardware Subsystems ───────────────────────────────────────────────────────
CONFIG_I2C=y               # <-- THIS WAKES UP THE I2C PINS

# ── Pointing & Logging ────────────────────────────────────────────────────────
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
# ... (leave your other debug settings as they are) ...

# ── Hardware & Subsystems ─────────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y    # <-- THIS IS THE MISSING LINK
