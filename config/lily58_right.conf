# ── TEMPORARY DEBUG CONFIG ────────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y

# REQUIRED FOR LOGGING: Wake up the serial hardware
CONFIG_SERIAL=y

# ── Pointing ──────────────────────────────────────────────────────────────────
CONFIG_ZMK_POINTING=y

# ── Debugging ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_USB_LOGGING=y
