# External ZMK modules to pull in at build time.
#
# englmaxi/zmk-dongle-display replaces the built-in ZMK widgets with a
# proper status screen showing:
#   - USB/BLE connection state
#   - Layer name
#   - Both peripheral battery percentages
#   - Active modifier keys (Ctrl/Shift/Alt/GUI)
#   - Bongo cat WPM animation
#
# Works with 0.96" SSD1306 128x64.
# Repo: https://github.com/englmaxi/zmk-dongle-display
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: englmaxi
      url-base: https://github.com/englmaxi
    # Add the remote for the trackpad driver
    - name: ergohaven
      url-base: https://github.com/ergohaven
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-dongle-display
      remote: englmaxi
      revision: main
    # Add the driver module to the build
    - name: zmk-driver-azoteq-iqs5xx
      remote: ergohaven
      revision: main
  self:
    path: config
