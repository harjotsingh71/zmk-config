# ── Left Half — Peripheral Config ─────────────────────────────────────────────
# The left half is now a pure BLE peripheral.
# It sends key events to the dongle; the dongle handles all USB/HID.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_LED=n

# Not the central anymore — dongle is
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# No USB HID output from the half
CONFIG_ZMK_USB=n

# ── Power saving ──────────────────────────────────────────────────────────────
# More aggressive sleep since the half only needs to stay connected to the
# nearby dongle, not all the way across the room to your PC.
# 30s to idle (dim display if present)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# 15min to deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── Display ───────────────────────────────────────────────────────────────────
# Your halves have nice!view displays. Once you have the pin wiring confirmed
# (either from PandaKB or by tracing the PCB), uncomment the block below and
# add a lily58_left.overlay file with the nice!view SPI node.
#
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
