# ── Dongle Config ─────────────────────────────────────────────────────────────
# The dongle is the USB central. Both halves are BLE peripherals.

# Split: act as central for 2 peripherals (left + right)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# Tell the dongle to expect two peripheral halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB HID — this is how the dongle talks to your PC
CONFIG_ZMK_USB=y

# No deep sleep — dongle is USB powered, no reason to sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=0

# ── ZMK Studio ────────────────────────────────────────────────────────────────
# Lets you remap keys live over USB without reflashing
CONFIG_ZMK_STUDIO=y
# Skip the unlock step — dongle is USB-only so no security risk
CONFIG_ZMK_STUDIO_LOCKING=n

# ── Display ───────────────────────────────────────────────────────────────────
# Disabled until SSD1306 is wired up. Uncomment all lines below once soldered.
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y

# ── Mock kscan ────────────────────────────────────────────────────────────────
# The dongle has no physical keys — all key events come from peripherals.
# We use a mock kscan driver so ZMK compiles without a real matrix.
CONFIG_ZMK_KSCAN_MOCK_DRIVER=y
